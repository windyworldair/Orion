[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "orion-sdk"
version = "1.0.0"
description = "The model-agnostic AI SDK by Zalcus. One interface, every LLM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Zalcus", email = "dev@zalcus.com" },
]
keywords = [
    "ai",
    "llm",
    "sdk",
    "openai",
    "anthropic",
    "claude",
    "gpt",
    "gemini",
    "ollama",
    "openrouter",
    "ai-sdk",
    "model-agnostic",
    "provider-abstraction",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
google = ["google-generativeai>=0.5"]
openrouter = ["openai>=1.0"]
ollama = ["requests>=2.28"]
tiktoken = ["tiktoken>=0.5"]
all = [
    "openai>=1.0",
    "anthropic>=0.20",
    "google-generativeai>=0.5",
    "requests>=2.28",
    "tiktoken>=0.5",
]

[project.urls]
Homepage = "https://github.com/zalcus/orion-sdk"
Documentation = "https://github.com/zalcus/orion-sdk#readme"
Repository = "https://github.com/zalcus/orion-sdk"
License = "https://github.com/zalcus/orion-sdk/blob/main/LICENSE"

[tool.setuptools.packages.find]
include = ["orion_sdk*"]
